            font-size: 1.5rem;
            font-weight: bold;

ETI/3XztoRcCCGEEEKIWCAhF0IIIYQQIoZIyIUQQgghhIghXiH/H4PgkBOST+c1AAAAAElFTkSuQmCC",
            textAfterImage: "Qual vantagem estrutural da lista duplamente encadeada fica evidente nesse trecho?",
            options: [
                "A - A inser��o dispensa mem�ria din�mica.",
                "B - N�o h� necessidade de ponteiros para inserir elementos.",
                "C - A lista passa a ordenar os dados automaticamente.",
                "D - Cada n� mant�m refer�ncias para o anterior e para o pr�ximo, facilitando ajustes de liga��o.",
                "E - A lista pode ser acessada apenas do fim para o in�cio."
            ],
            correctAnswerIndex: 3
        },

        
    ];

    // ==========================================
    // L�gica do Aplicativo
    // ==========================================
    let currentQuestionIndex = 0;
    let score = 0;

    const questionTextElement = document.getElementById("question-text");
    const questionImageElement = document.getElementById("question-image"); 
    const questionTextAfterElement = document.getElementById("question-text-after"); // Elemento do novo texto
    const optionsContainer = document.getElementById("options-container");
    const nextBtn = document.getElementById("next-btn");
    const questionCounter = document.getElementById("question-counter");
    const scoreTracker = document.getElementById("score-tracker");
    const quizSection = document.getElementById("quiz-section");
    const resultSection = document.getElementById("result-section");
    const finalScoreText = document.getElementById("final-score");

    function loadQuestion() {
        nextBtn.style.display = "none";
        optionsContainer.innerHTML = "";
        
        const currentQuestion = questions[currentQuestionIndex];
        
        questionTextElement.innerText = currentQuestion.question;
        questionCounter.innerText = `Pergunta ${currentQuestionIndex + 1} de ${questions.length}`;
        scoreTracker.innerText = `Acertos: ${score}`;

        // Verifica se a pergunta tem IMAGEM
        if (currentQuestion.image && currentQuestion.image !== "") {
            questionImageElement.src = currentQuestion.image;
            questionImageElement.style.display = "block";
        } else {
            questionImageElement.style.display = "none";
        }

        // Verifica se a pergunta tem TEXTO DEPOIS DA IMAGEM
        if (currentQuestion.textAfterImage && currentQuestion.textAfterImage !== "") {
            questionTextAfterElement.innerText = currentQuestion.textAfterImage;
            questionTextAfterElement.style.display = "block";
        } else {
            questionTextAfterElement.style.display = "none";
        }

        currentQuestion.options.forEach((optionText, index) => {
            const optionDiv = document.createElement("div");
            optionDiv.classList.add("option");
            optionDiv.innerText = optionText;
            optionDiv.onclick = () => selectOption(index, optionDiv);
            optionsContainer.appendChild(optionDiv);
        });
    }

    function selectOption(selectedIndex, selectedElement) {
        const currentQuestion = questions[currentQuestionIndex];
        const allOptions = optionsContainer.children;

        for (let i = 0; i < allOptions.length; i++) {
            allOptions[i].classList.add("disabled");
        }

        if (selectedIndex === currentQuestion.correctAnswerIndex) {
            selectedElement.classList.add("correct");
            score++;
            scoreTracker.innerText = `Acertos: ${score}`;
        } else {
            selectedElement.classList.add("incorrect");
            allOptions[currentQuestion.correctAnswerIndex].classList.add("correct");
        }

        nextBtn.style.display = "block";
    }

    function nextQuestion() {
        currentQuestionIndex++;
        
        if (currentQuestionIndex < questions.length) {
            loadQuestion();
        } else {
            showResults();
        }
    }

    function showResults() {
        quizSection.style.display = "none";
        resultSection.style.display = "block";
        
        const percentage = ((score / questions.length) * 100).toFixed(1);
        finalScoreText.innerText = `Voc� acertou ${score} de ${questions.length} (${percentage}%)`;
    }

    window.addEventListener('load', () => {
        if (typeof questions !== 'undefined' && questions.length > 0) {
            loadQuestion();
        } else {
            questionTextElement.innerText = "Erro: Nenhuma pergunta encontrada no array.";
        }
    });
