<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Simulado UNICID</title>
  <link rel="stylesheet" href="styles.css">
  <script src="questions.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <main class="app-shell">
    <section class="quiz-panel" aria-labelledby="app-title">
      <header class="quiz-header">
        <div>
          <p class="eyebrow">Simulado</p>
          <h1 id="app-title">UNICID</h1>
        </div>
        <div class="score-box" aria-live="polite">
          <span id="score-tracker">0 acertos</span>
        </div>
      </header>

      <div class="progress-wrap" aria-hidden="true">
        <span id="progress-bar"></span>
      </div>

      <section id="quiz-section" class="question-area" aria-live="polite">
        <div class="question-meta">
          <span id="question-counter">Carregando...</span>
          <span id="question-status"></span>
        </div>
        <h2 id="question-text">Carregando pergunta...</h2>
        <figure id="image-wrap" class="image-wrap" hidden>
          <img id="question-image" alt="Imagem da questão">
        </figure>
        <h3 id="question-text-after" hidden></h3>
        <div id="options-container" class="options-container"></div>
        <div class="actions">
          <button id="next-btn" class="btn primary" type="button" hidden>Próxima</button>
        </div>
      </section>

      <section id="result-section" class="result-section" hidden aria-live="polite">
        <p class="eyebrow">Resultado</p>
        <h2>Simulado concluído</h2>
        <p id="final-score"></p>
        <button id="restart-btn" class="btn primary" type="button">Refazer</button>
      </section>
    </section>
  </main>
</body>
</html>
